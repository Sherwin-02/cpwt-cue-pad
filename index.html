<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cue Pad">
  <meta name="theme-color" content="#3A0B16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>CPWT Cue Pad</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img id="logo" class="logo" src="assets/logo.svg" alt="Citipointe Church">
        <div class="brand-text">
          <span class="church">Citipointe Church</span>
          <span class="app-name">CPWT Cue Pad</span>
        </div>
      </div>
      <button id="showBtn" class="show-btn" type="button" aria-haspopup="dialog">
        <span id="showName">Show</span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="actions">
        <button id="remoteAddBtn" class="btn ghost" type="button" hidden aria-label="Add tracks to the main iPad">+ <span class="wide-only">Add </span>Tracks</button>
        <button id="remoteBtn" class="btn ghost" type="button" hidden>Remote</button>
        <button id="editBtn" class="btn ghost" type="button" aria-pressed="false">Edit</button>
        <button id="settingsBtn" class="btn ghost" type="button" aria-label="Settings" title="Settings">⚙︎</button>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <div class="stage">
      <main id="grid" class="grid" aria-label="Cues"></main>
      <div id="volume" class="vol"></div>
    </div>

    <div id="transport" class="transport"></div>

    <footer class="bottombar">
      <div id="now" class="now" aria-live="polite">Nothing playing</div>
      <div class="next-box">
        <button id="prevCue" class="btn step" type="button" aria-label="Move next cue back one">◀</button>
        <div class="next-text" aria-live="polite"><span class="next-tag">Next</span><span id="nextName">–</span></div>
        <button id="skipCue" class="btn step" type="button" aria-label="Skip the next cue">▶</button>
      </div>
      <button id="goBtn" class="btn big go" type="button">GO</button>
      <div class="ctl-group" role="group" aria-label="Current cue">
        <button id="fromStart" class="btn ctl" type="button" aria-label="Play the current cue from the start" title="From start" disabled></button>
        <button id="back10" class="btn ctl tp-skip" data-d="-10" type="button" aria-label="Back 10 seconds" title="Back 10 s" disabled></button>
        <button id="pauseAll" class="btn ctl pause" type="button" disabled></button>
        <button id="fwd10" class="btn ctl tp-skip" data-d="10" type="button" aria-label="Forward 10 seconds" title="Forward 10 s" disabled></button>
      </div>
      <div class="ctl-group" role="group" aria-label="Fades">
        <button id="fadeInBtn" class="btn ctl labelled" type="button" disabled></button>
        <button id="fadeOutBtn" class="btn ctl labelled" type="button" disabled></button>
        <button id="fadeMode" class="btn tp-fade" type="button" aria-pressed="false" title="When on, tapping a new tile fades the previous cue out">Fade: Off</button>
      </div>
      <button id="stopAll" class="btn ctl stop" type="button" aria-label="Stop all" title="Stop all"></button>
    </footer>
  </div>

  <div id="startOverlay" class="overlay" role="button" tabindex="0">
    <div class="overlay-card">
      <div class="overlay-title">CPWT Cue Pad</div>
      <div id="startMsg" class="overlay-msg">Tap anywhere to start</div>
    </div>
  </div>

  <div id="rotateOverlay" class="overlay rotate" hidden>
    <div class="overlay-card">
      <div class="rotate-icon" aria-hidden="true">⟲</div>
      <div class="overlay-title">Turn the iPad sideways</div>
      <div class="overlay-msg">Cue Pad is laid out for landscape. Audio keeps playing.</div>
      <button class="btn big stop rotate-stop" type="button">Stop all</button>
    </div>
  </div>

  <dialog id="sheet" class="sheet"></dialog>

  <input type="file" id="filePicker" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple hidden>
  <input type="file" id="replacePicker" accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>
  <input type="file" id="backupPicker" accept=".cuepad,application/octet-stream" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
